name: Test - Refactoring Verification

on:
  push:
    branches: [test/pre-refactor, refactor/hakyoung]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  checks: write

jobs:
  unit-test:
    name: Unit Tests (리팩토링 보존)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x ./gradlew
        working-directory: king-backend
      - run: ./gradlew test
        working-directory: king-backend
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: king-backend/build/test-results/test/*.xml
          reporter: java-junit

  bugfix-test:
    name: Bugfix Tests (버그 수정 검증)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x ./gradlew
        working-directory: king-backend
      - run: ./gradlew testBugfix
        working-directory: king-backend
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Bugfix Test Results
          path: king-backend/build/test-results/testBugfix/*.xml
          reporter: java-junit

  summary:
    name: Test Summary
    needs: [unit-test, bugfix-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bugfix Tests | ${{ needs.bugfix-test.result }} |" >> $GITHUB_STEP_SUMMARY
